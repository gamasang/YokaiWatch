<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f6f9">
<title>妖怪ウォッチ1 好きな妖怪種族メーカー</title>
<style>
:root {
  --bg: #f4f6f9;
  --text: #263238;
  --muted: #6b7280;
  --card: #ffffff;
  --border: #e5e7eb;
  --shadow: 0 6px 20px rgba(15, 23, 42, .08);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
    "Yu Gothic", "YuGothic", Meiryo, sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }

.app {
  width: min(100% - 24px, 760px);
  margin: 0 auto;
  padding: 28px 0 48px;
}
header { text-align: center; margin-bottom: 22px; }
h1 { margin: 0 0 8px; font-size: clamp(1.35rem, 5vw, 2rem); }
.subtitle { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.6; }

.toolbar {
  display: flex;
  gap: 8px;
  justify-content: center;
  flex-wrap: wrap;
  margin: 18px 0;
}
.action {
  border: 0;
  border-radius: 999px;
  padding: 10px 16px;
  background: #263238;
  color: #fff;
  cursor: pointer;
  font-weight: 700;
}
.action.secondary { background: #fff; color: #374151; border: 1px solid var(--border); }

.tribe-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}
.tribe-card {
  --tribe-color: #607d8b;
  position: relative;
  min-height: 108px;
  padding: 16px 14px;
  border: 3px solid var(--tribe-color);
  border-radius: 16px;
  background: var(--card);
  box-shadow: var(--shadow);
  cursor: pointer;
  text-align: left;
  transition: transform .12s ease, box-shadow .12s ease;
}
.tribe-card:active { transform: scale(.98); }
.tribe-card:hover { box-shadow: 0 8px 26px rgba(15, 23, 42, .12); }
.tribe-name { color: var(--tribe-color); font-weight: 800; font-size: .9rem; }
.selected {
  display: block;
  margin-top: 9px;
  font-size: 1.12rem;
  font-weight: 800;
  overflow-wrap: anywhere;
}
.selected.empty { color: #9ca3af; font-weight: 600; }
.count {
  position: absolute;
  right: 12px;
  top: 11px;
  color: #9ca3af;
  font-size: .72rem;
}

.result {
  margin-top: 22px;
  padding: 18px;
  border-radius: 16px;
  background: #fff;
  box-shadow: var(--shadow);
}
.result h2 { margin: 0 0 12px; font-size: 1rem; }
.result-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px 14px;
  margin: 0;
  padding: 0;
  list-style: none;
}
.result-list li { padding: 6px 0; border-bottom: 1px solid #f0f0f0; }
.result-list .label { font-size: .75rem; color: var(--muted); }
.result-list .value { display: block; font-weight: 800; }

footer {
  margin-top: 22px;
  text-align: center;
  color: #8a9299;
  font-size: .72rem;
  line-height: 1.6;
}

/* modal */
.modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: rgba(15, 23, 42, .62);
}
.modal.open { display: flex; }
.modal-panel {
  width: min(100%, 560px);
  max-height: min(88vh, 760px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 18px 60px rgba(0,0,0,.25);
}
.modal-head {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border);
}
.modal-title {
  margin: 0 0 10px;
  font-size: 1.15rem;
  font-weight: 800;
}
.search {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  outline: none;
}
.search:focus { border-color: #64748b; box-shadow: 0 0 0 3px rgba(100,116,139,.12); }
.yokai-list {
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 8px 12px 14px;
}
.yokai-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 6px 0;
  padding: 12px 13px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: #fff;
  color: var(--text);
  text-align: left;
  cursor: pointer;
}
.yokai-btn:hover { background: #f8fafc; }
.yokai-btn.is-selected {
  border-color: #334155;
  background: #f1f5f9;
  font-weight: 800;
}
.yokai-name { overflow-wrap: anywhere; }
.no-tag { flex: 0 0 auto; color: #9ca3af; font-size: .75rem; }
.empty-message { padding: 22px 8px; text-align: center; color: var(--muted); }
.modal-actions {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid var(--border);
}
.modal-actions button { flex: 1; }
.close-btn {
  padding: 11px;
  border: 0;
  border-radius: 10px;
  background: #e5e7eb;
  color: #374151;
  font-weight: 800;
  cursor: pointer;
}
.clear-one {
  padding: 11px;
  border: 0;
  border-radius: 10px;
  background: #fff1f2;
  color: #be123c;
  font-weight: 800;
  cursor: pointer;
}

@media (max-width: 480px) {
  .app { width: min(100% - 16px, 760px); padding-top: 20px; }
  .tribe-grid { gap: 9px; }
  .tribe-card { min-height: 98px; padding: 14px 11px; border-width: 2px; }
  .selected { font-size: 1rem; }
  .result-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>👻 好きな妖怪種族メーカー</h1>
    <p class="subtitle">妖怪ウォッチ1の妖怪から、各種族の「好きな妖怪」を1体ずつ選ぼう。</p>
  </header>

  <div class="toolbar">
    <button class="action secondary" id="clearAll" type="button">すべてリセット</button>
    <button class="action" id="copyResult" type="button">結果をコピー</button>
  </div>

  <section class="tribe-grid" id="tribeGrid" aria-label="種族一覧"></section>

  <section class="result" aria-live="polite">
    <h2>選択結果</h2>
    <ul class="result-list" id="resultList"></ul>
  </section>

  <footer>
    対象：妖怪ウォッチ1 No.001〜223（通常妖怪・レジェンド妖怪・宝石ニャン）<br>
    このサイトはファン制作の非公式ツールです。
  </footer>
</main>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <h2 class="modal-title" id="modalTitle">妖怪を選択</h2>
      <input class="search" id="searchInput" type="search" placeholder="妖怪名やNo.で検索" autocomplete="off">
    </div>
    <div class="yokai-list" id="yokaiList"></div>
    <div class="modal-actions">
      <button class="clear-one" id="clearOne" type="button">この種族を未選択にする</button>
      <button class="close-btn" id="closeModal" type="button">閉じる</button>
    </div>
  </div>
</div>

const STORAGE_KEY = "yokai-watch1-favorite-tribes-v1";
let selected = loadSelection();
let currentTribe = null;

const tribeGrid = document.getElementById("tribeGrid");
const resultList = document.getElementById("resultList");
const modal = document.getElementById("modal");
const modalTitle = document.getElementById("modalTitle");
const yokaiList = document.getElementById("yokaiList");
const searchInput = document.getElementById("searchInput");

function loadSelection() {
  try {
    const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch {
    return {};
  }
}

function saveSelection() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(selected));
}

function getTribe(tribeId) {
  return tribes.find(tribe => tribe.id === tribeId);
}

function getYokaiForTribe(tribeId) {
  return yokaiData.filter(yokai => yokai.tribe === tribeId);
}

function renderTribes() {
  tribeGrid.innerHTML = "";

  tribes.forEach(tribe => {
    const yokai = selected[tribe.id]
      ? yokaiData.find(item => item.no === selected[tribe.id])
      : null;

    const card = document.createElement("button");
    card.type = "button";
    card.className = "tribe-card";
    card.style.setProperty("--tribe-color", tribe.color);
    card.setAttribute("aria-label", `${tribe.name}の好きな妖怪を選ぶ`);

    const name = document.createElement("span");
    name.className = "tribe-name";
    name.textContent = tribe.name;

    const count = document.createElement("span");
    count.className = "count";
    count.textContent = `${getYokaiForTribe(tribe.id).length}体`;

    const selectedName = document.createElement("span");
    selectedName.className = "selected" + (yokai ? "" : " empty");
    selectedName.textContent = yokai ? yokai.name : "未選択";

    card.append(name, count, selectedName);
    card.addEventListener("click", () => openModal(tribe.id));
    tribeGrid.appendChild(card);
  });
}

function renderResults() {
  resultList.innerHTML = "";

  tribes.forEach(tribe => {
    const li = document.createElement("li");

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = tribe.name;

    const value = document.createElement("span");
    value.className = "value";

    const yokai = selected[tribe.id]
      ? yokaiData.find(item => item.no === selected[tribe.id])
      : null;

    value.textContent = yokai ? `${yokai.name}（No.${yokai.no}）` : "未選択";
    li.append(label, value);
    resultList.appendChild(li);
  });
}

function renderAll() {
  renderTribes();
  renderResults();
}

function openModal(tribeId) {
  currentTribe = tribeId;
  const tribe = getTribe(tribeId);

  modalTitle.textContent = `${tribe.name}の妖怪を選択`;
  searchInput.value = "";
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  renderYokaiList();
  requestAnimationFrame(() => searchInput.focus());
}

function closeModal() {
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
  currentTribe = null;
}

function renderYokaiList() {
  const keyword = searchInput.value.trim().toLowerCase();
  const list = getYokaiForTribe(currentTribe).filter(yokai => {
    if (!keyword) return true;
    return yokai.name.toLowerCase().includes(keyword) ||
      yokai.no.includes(keyword);
  });

  yokaiList.innerHTML = "";

  if (list.length === 0) {
    const message = document.createElement("div");
    message.className = "empty-message";
    message.textContent = "該当する妖怪がありません。";
    yokaiList.appendChild(message);
    return;
  }

  list.forEach(yokai => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "yokai-btn";
    if (selected[currentTribe] === yokai.no) {
      button.classList.add("is-selected");
    }

    const name = document.createElement("span");
    name.className = "yokai-name";
    name.textContent = yokai.name;

    const no = document.createElement("span");
    no.className = "no-tag";
    no.textContent = `No.${yokai.no}`;

    button.append(name, no);
    button.addEventListener("click", () => {
      selected[currentTribe] = yokai.no;
      saveSelection();
      renderAll();
      closeModal();
    });

    yokaiList.appendChild(button);
  });
}

function clearCurrentTribe() {
  if (!currentTribe) return;
  delete selected[currentTribe];
  saveSelection();
  renderAll();
  closeModal();
}

function clearAll() {
  if (!Object.keys(selected).length) return;
  if (!confirm("8種族の選択をすべてリセットしますか？")) return;

  selected = {};
  saveSelection();
  renderAll();
}

async function copyResult() {
  const lines = tribes.map(tribe => {
    const yokai = selected[tribe.id]
      ? yokaiData.find(item => item.no === selected[tribe.id])
      : null;
    return `${tribe.name}：${yokai ? `${yokai.name}（No.${yokai.no}）` : "未選択"}`;
  });

  const text = `妖怪ウォッチ1 好きな妖怪\n${lines.join("\n")}`;

  try {
    await navigator.clipboard.writeText(text);
    alert("選択結果をコピーしました！");
  } catch {
    window.prompt("以下をコピーしてください", text);
  }
}

document.getElementById("closeModal").addEventListener("click", closeModal);
document.getElementById("clearOne").addEventListener("click", clearCurrentTribe);
document.getElementById("clearAll").addEventListener("click", clearAll);
document.getElementById("copyResult").addEventListener("click", copyResult);
searchInput.addEventListener("input", renderYokaiList);

modal.addEventListener("click", event => {
  if (event.target === modal) closeModal();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && modal.classList.contains("open")) {
    closeModal();
  }
});

renderAll();
</script>
</body>
</html>
