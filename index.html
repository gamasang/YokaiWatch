        .subtitle { font-size: 0.85rem; color: #7f8c8d; margin-top: 0; margin-bottom: 20px; }
        
        /* 8種族のグリッド（2列） */
        .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; max-width: 450px; margin: 0 auto 30px; }
        
        /* 各マスの基本スタイル */
        .slot { background: white; border-radius: 12px; padding: 15px 10px; min-height: 75px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.1s; }
        .slot:active { transform: scale(0.95); }
        .slot-title { font-weight: bold; font-size: 0.85rem; margin-bottom: 6px; }
        .selected-name { font-size: 1.1rem; font-weight: bold; color: #333; }
        
        /* 各種族の公式イメージカラー */
        .isamashi { border: 3px solid #e74c3c; } .isamashi .slot-title { color: #e74c3c; }
        .fushigi { border: 3px solid #f1c40f; } .fushigi .slot-title { color: #f39c12; }
        .goketsu { border: 3px solid #e67e22; } .goketsu .slot-title { color: #d35400; }
        .purichi { border: 3px solid #e84393; } .purichi .slot-title { color: #e84393; }
        .pokapoka { border: 3px solid #2ecc71; } .pokapoka .slot-title { color: #27ae60; }
        .usurakage { border: 3px solid #9b59b6; } .usurakage .slot-title { color: #8e44ad; }
        .bukimi { border: 3px solid #1abc9c; } .bukimi .slot-title { color: #16a085; }
        .nyororon { border: 3px solid #3498db; } .nyororon .slot-title { color: #2980b9; }

        /* スクロール可能なポップアップ */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); align-items: center; justify-content: center; z-index: 1000; }
        .modal-content { background: white; padding: 20px; border-radius: 20px; width: 85%; max-width: 340px; max-height: 70%; display: flex; flex-direction: column; }
        .modal-header { font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; text-align: center; }
        .yokai-list-wrapper { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        
        /* リスト内のボタン */
        .yokai-btn { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 12px; margin: 8px 0; font-size: 1rem; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; color: #333; -webkit-tap-highlight-color: transparent; }
        .yokai-btn .no-tag { font-size: 0.75rem; color: #aaa; font-family: monospace; }
        .yokai-btn:active { background: #f5f5f5; }
        .close-btn { width: 100%; padding: 12px; margin-top: 15px; font-size: 1rem; border: none; border-radius: 8px; background: #bdc3c7; color: white; font-weight: bold; }

let currentType = "";
function openModal(type, typeName) {
currentType = type;
document.getElementById("modalTitle").innerText = ${typeName}を選択;
const listDiv = document.getElementById("yokaiList");
listDiv.innerHTML = "";
yokaiData.forEach(yokai => {
if (yokai.tribe === type) {
const btn = document.createElement("button");
btn.className = "yokai-btn";
const noDisplay = yokai.no === "-" ? "No.-" : No.${yokai.no};
btn.innerHTML = <span>${yokai.name}</span><span class="no-tag">${noDisplay}</span>;
btn.onclick = () => selectYokai(yokai.name);
listDiv.appendChild(btn);
}
});
document.getElementById("yokaiModal").style.display = "flex";
}
function selectYokai(name) {
document.getElementById(slot-${currentType}).innerText = name;
closeModal();
}
function closeModal() {
document.getElementById("yokaiModal").style.display = "none";
}
